<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drone Directive — News & Roadmap</title>
    <meta
      id="meta-desc"
      name="description"
      content="Drone Directive updates: newly released features, upcoming roadmap plans, and a quick gameplay overview."
    />
    <style>
      :root {
        --bg: #f3efe4;
        --card: #fffaf0;
        --text: #1f2a2e;
        --muted: #4f6066;
        --accent: #d45b2c;
        --accent-soft: #f5d7bf;
        --line: #e3d8c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Space Grotesk', 'Trebuchet MS', 'Segoe UI', sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 0%, #f8dcc1 0, transparent 38%),
          radial-gradient(circle at 85% 100%, #c7ddd8 0, transparent 40%), var(--bg);
      }

      main {
        width: min(860px, 92vw);
        margin: 40px auto;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 16px 45px rgba(50, 38, 22, 0.12);
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #5a250f;
        font-weight: 700;
        font-size: 0.84rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .lang-switch {
        display: flex;
        gap: 6px;
      }

      .lang-btn {
        appearance: none;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        border-radius: 8px;
        padding: 5px 10px;
        font-weight: 600;
        font-size: 0.84rem;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }

      .lang-btn:hover {
        border-color: var(--accent);
      }

      .lang-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.02em;
      }

      .lead {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.5;
      }

      h2 {
        margin: 24px 0 10px;
        font-size: 1.25rem;
      }

      p {
        line-height: 1.6;
      }

      ul {
        margin: 10px 0 18px;
        padding-left: 22px;
      }

      li {
        margin: 8px 0;
        line-height: 1.55;
      }

      .top-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /*
        Styled as the page's one call to action rather than as a nav link: someone who
        arrived here from a search result has never seen the game, and a quiet
        underlined "home" would read as site furniture rather than as the way in.
      */
      .home-link {
        display: inline-block;
        padding: 6px 12px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 0.84rem;
        text-decoration: none;
        white-space: nowrap;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .home-link:hover,
      .home-link:focus-visible {
        background: #fff;
        color: var(--accent);
      }

      .footer-cta {
        margin: 14px 0 0;
      }

      .latest {
        list-style: none;
        margin: 10px 0 22px;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      .latest li {
        margin: 0;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 12px;
        background: #fff;
      }

      .latest h3 {
        margin: 0 0 6px;
        font-size: 1.02rem;
      }

      .latest p {
        margin: 0;
        color: var(--muted);
      }

      .accent {
        color: var(--accent);
        font-weight: 700;
      }

      .footer {
        margin-top: 28px;
        padding-top: 14px;
        border-top: 1px dashed var(--line);
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 640px) {
        main {
          margin: 16px auto;
          padding: 18px;
          border-radius: 14px;
        }

        .top-bar {
          flex-wrap: wrap;
        }

        .lead {
          font-size: 1rem;
        }
      }
    </style>
  </head>

      const STORAGE_KEY = 'dd:locale';
      const SUPPORTED = Object.keys(LOCALES);

      function detectLocale() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored && SUPPORTED.includes(stored)) return stored;
        } catch (_) {}

        const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (const lang of langs) {
          if (!lang) continue;
          const code = lang.toLowerCase().split('-')[0];
          if (SUPPORTED.includes(code)) return code;
        }
        return 'en';
      }

      function applyLocale(lang) {
        const locale = LOCALES[lang] || LOCALES.en;
        document.documentElement.lang = locale.htmlLang;
        document.title = locale.metaTitle;
        const metaDesc = document.getElementById('meta-desc');
        if (metaDesc) metaDesc.setAttribute('content', locale.metaDesc);

        document.getElementById('badge').textContent = locale.badge;
        document.getElementById('title').textContent = locale.title;
        document.getElementById('lead').textContent = locale.lead;
        const latestEl = document.getElementById('latest-items');
        latestEl.innerHTML = '';
        locale.latest.forEach((item) => {
          const li = document.createElement('li');
          const h3 = document.createElement('h3');
          h3.textContent = item.title;
          const text = document.createElement('p');
          text.textContent = item.text;
          li.append(h3, text);
          latestEl.appendChild(li);
        });

        document.getElementById('h-latest').textContent = locale.hLatest;
        document.getElementById('h-gameplay').textContent = locale.hGameplay;
        document.getElementById('gameplay-intro').innerHTML = locale.gameplayIntro;

        const pointsEl = document.getElementById('gameplay-points');
        pointsEl.innerHTML = '';
        locale.points.forEach((text) => {
          const li = document.createElement('li');
          li.textContent = text;
          pointsEl.appendChild(li);
        });

        document.getElementById('h-purpose').textContent = locale.hPurpose;
        document.getElementById('purpose-desc').textContent = locale.purposeDesc;
        document.getElementById('footer-text').textContent = locale.footer;
        // Same string in both places on purpose — one label to translate, and the
        // reader meets the same wording whether they act before reading or after.
        document.getElementById('home-link').textContent = locale.homeLink;
        document.getElementById('home-link-bottom').textContent = locale.homeLink;

        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        try {
          localStorage.setItem(STORAGE_KEY, lang);
        } catch (_) {}
      }

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const lang = btn.getAttribute('data-lang');
          if (lang) applyLocale(lang);
        });
      });

      applyLocale(detectLocale());
    </script>
  </body>
</html>
