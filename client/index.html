<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Both files are generated from `assets-src/favicon.png` by
         `scripts/encode-favicon.mjs` — don't hand-edit them, and don't add a
         `sizes` list: the .ico already carries 16/32/48 and browsers pick.
         The touch icon is opaque because iOS composites a transparent one onto
         black, which would eat this mark's dark outline. -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` is here for one symptom: on a tablet with a display
         cutout, Chrome *letterboxes* a fullscreen page away from it, and the game
         gets a black strip along the camera edge — in landscape, across the top.
         The letterbox is the default precisely because a page that has not opted
         in may put a button under the camera; `cover` is that opt-in, and `.hud`
         below pays for it with `env(safe-area-inset-*)` padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a06" />
    <!-- The title-screen splash is the first thing the player sees, but its URL is
         built in JS and handed to CSS as a custom property (config/sprites.ts →
         MainMenu), so without this the fetch cannot even start until the whole
         bundle has parsed and run. Preloading here moves it into the HTML parser,
         alongside the bundle instead of behind it.
         The `/` prefix must match what `menuBackdropSrc` builds from
         `import.meta.env.BASE_URL` (`/`, since `base: '/'`) — the same URL, hence
         one fetch rather than two. -->
    <link rel="preload" as="image" href="/menu-backdrop.webp" fetchpriority="high" />

    <title>Drone Directive — free browser RTS</title>
    <meta
      name="description"
      content="Build, arm and program robots to destroy the enemy base before it destroys yours. A free top-down real-time strategy game in the browser — no install, no sign-up."
    />
    <!-- `www` is a second custom domain serving the same Worker, so without this
         the two hostnames are duplicate content. Points at the apex. -->
    <link rel="canonical" href="https://drone-directive.space/" />

    <!-- Open Graph / Twitter. URLs here must be absolute: unfurlers fetch them out
         of context and do not resolve relative paths. `social-card.jpg` is cropped
         to OG's 1.91:1 from the backdrop master (see .docs/sprites/menu-backdrop.md)
         so the composition survives — the 16:9 backdrop would get cut by the
         platform instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Drone Directive" />
    <meta property="og:title" content="Drone Directive — free browser RTS" />
    <meta
      property="og:description"
      content="Build, arm and program robots to destroy the enemy base before it destroys yours. Play solo against bots or online against a friend."
    />
    <meta property="og:url" content="https://drone-directive.space/" />
    <meta property="og:image" content="https://drone-directive.space/social-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A blue six-legged siege walker and tracked robot on a dark battlefield, facing a distant enemy factory glowing red."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <!-- Title, description and image are inherited from the og:* tags above; only
         the card type has no Open Graph equivalent. -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data. The interface is translated into four languages but the
         markup cannot be: there is one URL, and `<html lang>` is rewritten at
         runtime from the store (src/main.tsx), so `inLanguage` is the honest place
         to say what the game speaks. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Drone Directive",
        "url": "https://drone-directive.space/",
        "image": "https://drone-directive.space/social-card.jpg",
        "description": "A top-down real-time strategy game in the browser. Build, arm and program robots to destroy the enemy base before it destroys yours.",
        "genre": ["Real-time strategy", "Strategy"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "inLanguage": ["en", "ru", "uk", "pl"],
        "isAccessibleForFree": true,
        "license": "https://www.gnu.org/licenses/gpl-3.0.html",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Boot placeholder: shown while the UI locale chunk loads, before React mounts
         (see src/main.tsx). Inline + literal colours so it needs no stylesheet —
         which means it cannot know the player's theme and has to guess. It guesses
         `DEFAULT_THEME` (theme/theme.ts); anyone with another scheme saved gets one
         frame of this one before `<html data-theme>` is written. Keep in step when
         the default moves. -->
    <style>
      #boot {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: #050a06;
      }
      #boot::after {
        content: '';
        width: 28px;
        height: 28px;
        border: 2px solid #1c7a32;
        border-top-color: #00d45a;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
