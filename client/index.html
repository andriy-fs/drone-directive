<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Directive</title>
    <!-- Boot placeholder: shown while the UI locale chunk loads, before React mounts
         (see src/main.tsx). Inline + literal colours so it needs no stylesheet. -->
    <style>
      #boot {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: #0d1117;
      }
      #boot::after {
        content: '';
        width: 28px;
        height: 28px;
        border: 2px solid #232a36;
        border-top-color: #6b7686;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
