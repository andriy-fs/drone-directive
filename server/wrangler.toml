# Cloudflare Worker relay for online multiplayer. Deploy with `npm run deploy -w server`
# (requires `wrangler login`); run locally with `npm run dev -w server` (no login needed).
name = "drone-directive-relay"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# One Durable Object per room pairs the two player sockets and relays ticks.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed classes are required for Durable Objects on the free plan
# (this relay keeps only in-memory state, but must still be declared this way).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
