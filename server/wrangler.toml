# Cloudflare Worker relay for online multiplayer. Deploy with `npm run deploy -w server`
# (requires `wrangler login`); run locally with `npm run dev -w server` (no login needed).
name = "drone-directive-relay"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# The relay lives on its own hostname, not on the game's. It routes a match at the
# root path (`/?room=…`), which is exactly where the static site's `index.html`
# would sit — one origin cannot serve both without moving the match endpoint. A
# subdomain keeps the wire protocol untouched. See `.docs/deployment.md`.
[[routes]]
pattern = "relay.drone-directive.space"
custom_domain = true

# One Durable Object per room pairs the two player sockets and relays ticks.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# One Durable Object per chat, addressed by the opaque id `Room` issues in
# `start`. Separate from ROOM on purpose: a chat outlives the match, so it needs
# its own lifetime, its own socket, and (unlike ROOM) real storage.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "Chat"

# SQLite-backed classes are required for Durable Objects on the free plan
# (this relay keeps only in-memory state, but must still be declared this way).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Adding a DO class is a migration of its own; `Chat` really does use its SQLite
# storage, for the message log and the retention alarm.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Chat"]
