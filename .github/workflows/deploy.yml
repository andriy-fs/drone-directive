name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # The static game, as an assets-only Worker on drone-directive.space (see
  # client/wrangler.toml). Tests gate the deploy: a red suite must not reach the
  # domain.
  deploy-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # The relay hostname is deliberately NOT passed here: it lives in
      # `client/.env.production`. An unset repository variable expands to an empty
      # string, which shadows the env file instead of falling back to it, and the
      # build would quietly ship the localhost dev relay.
      - name: Build app
        run: npm run build
        env:
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}

      - name: Deploy static site
        run: npm run deploy -w client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The multiplayer relay, on relay.drone-directive.space. Independent of the
  # client deploy — no ordering dependency, since the two are linked only by the
  # build-time VITE_MULTIPLAYER_URL, and that hostname is stable.
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Deploy relay Worker
        run: npm run deploy -w server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
